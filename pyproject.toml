[project]
name = "travelmind"
version = "0.1.0"
description = "AI-powered Travel Planning & Long-term Rental Assistant"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "your.email@example.com" }]
keywords = ["ai", "travel", "agent", "langgraph", "fastapi"]

dependencies = [
    # AI/LLM Frameworks
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "dashscope>=1.20.0",       # 通义千问 SDK
    "openai>=1.0.0",           # DeepSeek API (OpenAI 兼容)
    
    # Vector Database
    "chromadb>=0.5.0",
    
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    
    # HTTP Client
    "httpx>=0.27.0",
    "aiohttp>=3.10.0",
    
    # Data Validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    
    # Utilities
    "python-dotenv>=1.0.0",
    "tenacity>=9.0.0",         # 重试机制
    "structlog>=24.4.0",       # 结构化日志
    
    # Observability
    "langfuse>=2.0.0,<3.0.0",  # v2 SDK 兼容自托管 Langfuse v2.x
    
    # Redis for caching (optional)
    "redis>=5.0.0",
    
    # Database - PostgreSQL
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",         # PostgreSQL 异步驱动
    "alembic>=1.13.0",         # 数据库迁移
    
    # Authentication
    "python-jose[cryptography]>=3.3.0",  # JWT
    "passlib[bcrypt]>=1.7.4",  # 密码哈希（备用）
    
    # SMS Service - Tencent Cloud
    "tencentcloud-sdk-python-sms>=3.0.0",
    
    # Rate Limiting
    "cachetools>=5.3.0",       # 内存缓存工具
]

[project.optional-dependencies]
# 生产环境推荐安装
prod = [
    "langgraph-checkpoint-redis>=0.1.0",  # Redis 会话持久化
]

dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = ["E501", "B008", "B904"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__init__.py"]
