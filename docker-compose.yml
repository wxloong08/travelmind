# ============================================================
# TravelMind Docker Compose 配置
#
# 使用方法:
#   docker-compose up -d              # 启动所有服务
#   docker-compose up -d --build      # 重新构建并启动
#   docker-compose logs -f            # 查看日志
#   docker-compose down               # 停止服务
#
# 服务说明:
#   - app: TravelMind API 服务
#   - postgres: 用户数据库（用户、行程、对话）
#   - redis: 缓存和限流（可选）
#   - langfuse: 可观测性平台（可选）
# ============================================================

services:
  # ============================================================
  # TravelMind API
  # ============================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travelmind
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      # 基础配置
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-true}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}

      # LLM 配置【必须】
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-qwen-turbo}

      # 外部 API【推荐】
      - AMAP_API_KEY=${AMAP_API_KEY:-}
      - BOCHA_API_KEY=${BOCHA_API_KEY:-}
      # 图片搜索 API
      - UNSPLASH_ACCESS_KEY=${UNSPLASH_ACCESS_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GOOGLE_SEARCH_ENGINE_ID=${GOOGLE_SEARCH_ENGINE_ID:-}

      # DeepSeek 评分模型【可选】
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}

      # 向量数据库
      - CHROMA_PERSIST_DIR=/app/data/chroma

      # 用户系统 - PostgreSQL
      - DATABASE_URL=postgresql+asyncpg://travelmind:${POSTGRES_PASSWORD:-travelmind123}@postgres:5432/travelmind

      # 用户系统 - Redis（可选）
      - REDIS_URL=redis://redis:6379/0

      # 用户系统 - JWT
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production-use-openssl-rand-hex-32}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-60}

      # 用户系统 - 腾讯云短信（可选）
      - TENCENT_SMS_SECRET_ID=${TENCENT_SMS_SECRET_ID:-}
      - TENCENT_SMS_SECRET_KEY=${TENCENT_SMS_SECRET_KEY:-}
      - TENCENT_SMS_APP_ID=${TENCENT_SMS_APP_ID:-}
      - TENCENT_SMS_SIGN_NAME=${TENCENT_SMS_SIGN_NAME:-TravelMind}
      - TENCENT_SMS_TEMPLATE_ID=${TENCENT_SMS_TEMPLATE_ID:-}

      # Langfuse - 连接到同网络的 langfuse 服务
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_HOST=http://langfuse:3000
    volumes:
      - travelmind_data:/app/data
    networks:
      - travelmind-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/v1/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============================================================
  # PostgreSQL 数据库 - 用户系统
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: travelmind-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=travelmind
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-travelmind123}
      - POSTGRES_DB=travelmind
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - travelmind-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U travelmind" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Redis 缓存（可选但推荐）
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: travelmind-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - travelmind-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================================
  # Langfuse 可观测性平台（可选）
  # ============================================================
  langfuse:
    image: langfuse/langfuse:2
    container_name: travelmind-langfuse
    restart: unless-stopped
    profiles:
      - observability # 使用 docker-compose --profile observability up 启动
    ports:
      - "${LANGFUSE_PORT:-3000}:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@langfuse-db:5432/langfuse
      - NEXTAUTH_SECRET=${LANGFUSE_NEXTAUTH_SECRET:-travelmind-secret-min-32-chars-here}
      - NEXTAUTH_URL=http://localhost:3000
      - SALT=${LANGFUSE_SALT:-travelmind-salt-min-32-characters}
      - TELEMETRY_ENABLED=false
    networks:
      - travelmind-network
    depends_on:
      langfuse-db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/public/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ============================================================
  # Langfuse PostgreSQL 数据库
  # ============================================================
  langfuse-db:
    image: postgres:15-alpine
    container_name: travelmind-langfuse-db
    restart: unless-stopped
    profiles:
      - observability
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=langfuse
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data
    networks:
      - travelmind-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  travelmind-network:
    driver: bridge

volumes:
  travelmind_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
  langfuse_db_data:
    driver: local
